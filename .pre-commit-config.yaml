# Pre-commit hooks for Article Eater
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Local hooks for project-specific validation
  - repo: local
    hooks:
      - id: validate-json-templates
        name: Validate JSON Templates
        entry: python scripts/validate_all_templates.py
        language: python
        files: ^data/templates/.*\.json$
        pass_filenames: false
        additional_dependencies: [jsonschema]

      - id: validate-toulmin
        name: Validate Toulmin Justifications
        entry: python scripts/validate_toulmin.py
        language: python
        files: ^data/templates/.*\.json$
        pass_filenames: false

  # Standard Python hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
        files: \.json$
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']

  # isort for import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]

  # Ruff for Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
