<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="Georgia, 'Times New Roman', serif">
  <title>Figure 7. Reflective Equilibrium in Practice: The Barrett-Craig Compromise</title>
  <text x="410" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Figure 7. Reflective Equilibrium in Practice: The Barrett-Craig Compromise</text>

  <defs>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#2a6e2a"/></marker>
    <marker id="abl" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#2255aa"/></marker>
    <marker id="apu" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#8844aa"/></marker>
  </defs>

  <!-- BEFORE panel -->
  <rect x="15" y="38" width="380" height="210" rx="8" fill="#f8f0f0" stroke="#cc5555" stroke-width="2"/>
  <text x="205" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#cc3333">BEFORE: Unresolved Competition</text>
  <text x="205" y="75" text-anchor="middle" font-size="9" fill="#555">Coherence = 0.304 (competition drags it down)</text>

  <!-- T1 Interoception -->
  <rect x="125" y="85" width="160" height="35" rx="5" fill="#dce8d4" stroke="#6b8e5b" stroke-width="1.5"/>
  <text x="205" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Interoception (T1, c=0.78)</text>

  <!-- Two competing templates -->
  <rect x="35" y="155" width="150" height="50" rx="5" fill="#f0d8d8" stroke="#cc5555" stroke-width="1.5"/>
  <text x="110" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Barrett Template</text>
  <text x="110" y="186" text-anchor="middle" font-size="8" fill="#555">c = 0.45 | FUNCTIONAL</text>
  <text x="110" y="198" text-anchor="middle" font-size="7" fill="#888">Constructionist affect</text>

  <rect x="215" y="155" width="150" height="50" rx="5" fill="#f0d8d8" stroke="#cc5555" stroke-width="1.5"/>
  <text x="290" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Craig Template</text>
  <text x="290" y="186" text-anchor="middle" font-size="8" fill="#555">c = 0.50 | MECHANISM</text>
  <text x="290" y="198" text-anchor="middle" font-size="7" fill="#888">Labelled-line affect</text>

  <!-- Competition zigzag -->
  <path d="M 185 180 L 192 173 L 196 183 L 200 173 L 204 183 L 215 178" stroke="#cc3333" stroke-width="2.5" fill="none"/>
  <text x="200" y="220" text-anchor="middle" font-size="8" fill="#cc3333" font-weight="bold">UNRESOLVED</text>
  <text x="200" y="232" text-anchor="middle" font-size="7" fill="#cc3333">α = −0.30 (mutual suppression)</text>

  <!-- Bridge edges -->
  <line x1="170" y1="120" x2="110" y2="153" stroke="#2255aa" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#abl)"/>
  <line x1="240" y1="120" x2="290" y2="153" stroke="#2255aa" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#abl)"/>

  <!-- BIG ARROW: The Crucible -->
  <rect x="175" y="260" width="250" height="40" rx="6" fill="#fff8e0" stroke="#cc7700" stroke-width="2"/>
  <text x="300" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5500">THE CRUCIBLE (Panel Debate)</text>
  <text x="300" y="294" text-anchor="middle" font-size="8" fill="#cc7700">Key evidence: posterior insula = modality-specific; anterior = context-dependent</text>

  <line x1="410" y1="150" x2="410" y2="260" stroke="#cc7700" stroke-width="3" marker-end="url(#ag)"/>

  <!-- AFTER panel -->
  <rect x="425" y="38" width="380" height="430" rx="8" fill="#f0f8f0" stroke="#2a8e2a" stroke-width="2"/>
  <text x="615" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a6e2a">AFTER: Compromise (Two-Stage Model)</text>
  <text x="615" y="75" text-anchor="middle" font-size="9" fill="#555">Coherence = 0.321 (+0.017 improvement)</text>

  <!-- T1 Interoception -->
  <rect x="535" y="85" width="160" height="35" rx="5" fill="#dce8d4" stroke="#6b8e5b" stroke-width="1.5"/>
  <text x="615" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Interoception (T1, c=0.78)</text>

  <!-- NEW Working Model -->
  <rect x="510" y="140" width="210" height="45" rx="6" fill="#f0e8f0" stroke="#8844aa" stroke-width="2.5"/>
  <text x="615" y="159" text-anchor="middle" font-size="10" font-weight="bold" fill="#6633aa">Barrett-Craig Two-Stage</text>
  <text x="615" y="176" text-anchor="middle" font-size="9" fill="#6633aa">NEW Working Model | c = 0.65</text>

  <text x="505" y="145" font-size="16" fill="#2a8e2a" font-weight="bold">★</text>

  <!-- Reduction from T1 -->
  <line x1="615" y1="120" x2="615" y2="138" stroke="#2a6e2a" stroke-width="2" marker-end="url(#ag)"/>

  <!-- Two templates now domain-restricted -->
  <rect x="445" y="210" width="155" height="60" rx="5" fill="#d8e8d8" stroke="#2a8e2a" stroke-width="1.5"/>
  <text x="522" y="228" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Craig Template</text>
  <text x="522" y="243" text-anchor="middle" font-size="8" fill="#2a6e2a">c = 0.60 (boosted)</text>
  <text x="522" y="257" text-anchor="middle" font-size="7" fill="#2a6e2a" font-weight="bold">Domain: posterior insula</text>
  <text x="522" y="267" text-anchor="middle" font-size="7" fill="#555">Early, modality-specific</text>

  <rect x="620" y="210" width="155" height="60" rx="5" fill="#d8e8d8" stroke="#2a8e2a" stroke-width="1.5"/>
  <text x="697" y="228" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Barrett Template</text>
  <text x="697" y="243" text-anchor="middle" font-size="8" fill="#2a6e2a">c = 0.55 (boosted)</text>
  <text x="697" y="257" text-anchor="middle" font-size="7" fill="#2a6e2a" font-weight="bold">Domain: anterior insula</text>
  <text x="697" y="267" text-anchor="middle" font-size="7" fill="#555">Later, constructionist</text>

  <!-- Working model edges (purple) -->
  <line x1="560" y1="185" x2="522" y2="208" stroke="#8844aa" stroke-width="2" marker-end="url(#apu)"/>
  <line x1="670" y1="185" x2="697" y2="208" stroke="#8844aa" stroke-width="2" marker-end="url(#apu)"/>
  <text x="540" y="200" font-size="7" fill="#8844aa">WM edge</text>
  <text x="680" y="200" font-size="7" fill="#8844aa">WM edge</text>

  <!-- Partial-out edge -->
  <line x1="600" y1="240" x2="620" y2="240" stroke="#999" stroke-width="2" stroke-dasharray="6,2,2,2"/>
  <text x="610" y="236" text-anchor="middle" font-size="6" fill="#999">partial-out</text>

  <!-- RESOLVED label -->
  <rect x="555" y="280" width="120" height="22" rx="4" fill="#d8f0d8" stroke="#2a8e2a" stroke-width="1"/>
  <text x="615" y="295" text-anchor="middle" font-size="9" font-weight="bold" fill="#2a6e2a">COMPROMISE ✓</text>

  <!-- What changed box -->
  <rect x="445" y="310" width="340" height="148" rx="4" fill="#fff" stroke="#2a8e2a" stroke-width="1"/>
  <text x="455" y="330" font-size="10" font-weight="bold" fill="#2a6e2a">What changed in the web:</text>
  <text x="455" y="348" font-size="9" fill="#555">1. Competition edge → status: COMPROMISE</text>
  <text x="455" y="363" font-size="9" fill="#555">2. New WM_BARRETT_CRAIG node created (c=0.65)</text>
  <text x="455" y="378" font-size="9" fill="#555">3. Working model edges to both templates</text>
  <text x="455" y="393" font-size="9" fill="#555">4. Domain qualifiers restrict each template's scope</text>
  <text x="455" y="408" font-size="9" fill="#555">5. Partial-out edge prevents double-counting</text>
  <text x="455" y="428" font-size="9" fill="#555" font-style="italic">6. BN regenerated with composite CPT (tighter)</text>
  <text x="455" y="448" font-size="9" fill="#2a6e2a" font-weight="bold">Algorithm can VERIFY this improves coherence.</text>
  <text x="455" y="460" font-size="9" fill="#cc3333" font-weight="bold">Algorithm could NOT GENERATE the insight.</text>

  <!-- Bottom note for BEFORE side -->
  <rect x="30" y="310" width="365" height="152" rx="4" fill="#fff8f0" stroke="#cc7700" stroke-width="1"/>
  <text x="40" y="330" font-size="10" font-weight="bold" fill="#8a5500">Why this is reflective equilibrium:</text>
  <text x="40" y="348" font-size="9" fill="#555">General principles (Barrett's constructionism,</text>
  <text x="40" y="363" font-size="9" fill="#555">Craig's labelled-line theory) were confronted</text>
  <text x="40" y="378" font-size="9" fill="#555">with particular findings (posterior = modality-</text>
  <text x="40" y="393" font-size="9" fill="#555">specific, anterior = context-dependent).</text>
  <text x="40" y="413" font-size="9" fill="#555" font-weight="bold">Neither principle survived intact.</text>
  <text x="40" y="428" font-size="9" fill="#555">The two-stage model was NOT in either</text>
  <text x="40" y="443" font-size="9" fill="#555">tradition's prior hypothesis space — it emerged</text>
  <text x="40" y="458" font-size="9" fill="#555">from the confrontation. The hypothesis space</text>
  <text x="40" y="462" font-size="9" fill="#cc7700" font-weight="bold">was expanded, not merely searched.</text>
</svg>
