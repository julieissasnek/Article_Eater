<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" font-family="Georgia, 'Times New Roman', serif">
  <title>Figure 3. The Tier Hierarchy and Eight Edge Types</title>
  <text x="420" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Figure 3. A Concrete Subgraph: Tier Hierarchy and Eight Edge Types</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2a6e2a"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2255aa"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#cc3333"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8844aa"/></marker>
    <marker id="a5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#aa7722"/></marker>
    <marker id="a6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#666"/></marker>
    <marker id="a7" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#cc7700"/></marker>
  </defs>

  <!-- Tier labels (left side) -->
  <rect x="8" y="56" width="55" height="70" rx="4" fill="#dce8d4" stroke="#6b8e5b" stroke-width="1"/>
  <text x="35" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a2a">T1</text>
  <text x="35" y="95" text-anchor="middle" font-size="8" fill="#555">Frameworks</text>
  <text x="35" y="107" text-anchor="middle" font-size="7" fill="#777">ent = 0.95</text>

  <rect x="8" y="170" width="55" height="70" rx="4" fill="#e4dcc8" stroke="#9b8e6e" stroke-width="1"/>
  <text x="35" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b5a2a">T1.5</text>
  <text x="35" y="209" text-anchor="middle" font-size="8" fill="#555">Domain</text>
  <text x="35" y="221" text-anchor="middle" font-size="7" fill="#777">ent = 0.80</text>

  <rect x="8" y="290" width="55" height="70" rx="4" fill="#d4dce8" stroke="#5b6e8e" stroke-width="1"/>
  <text x="35" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a3a5a">T2</text>
  <text x="35" y="329" text-anchor="middle" font-size="8" fill="#555">Templates</text>
  <text x="35" y="341" text-anchor="middle" font-size="7" fill="#777">ent = 0.50</text>

  <!-- T1 nodes -->
  <rect x="90" y="60" width="170" height="55" rx="8" fill="#dce8d4" stroke="#6b8e5b" stroke-width="2"/>
  <text x="175" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Predictive Processing</text>
  <text x="175" y="97" text-anchor="middle" font-size="9" fill="#555">c = 0.85</text>
  <text x="175" y="108" text-anchor="middle" font-size="8" fill="#777">T1 Framework</text>

  <rect x="310" y="60" width="170" height="55" rx="8" fill="#dce8d4" stroke="#6b8e5b" stroke-width="2"/>
  <text x="395" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Neuromodulation</text>
  <text x="395" y="97" text-anchor="middle" font-size="9" fill="#555">c = 0.80</text>
  <text x="395" y="108" text-anchor="middle" font-size="8" fill="#777">T1 Framework</text>

  <rect x="530" y="60" width="170" height="55" rx="8" fill="#dce8d4" stroke="#6b8e5b" stroke-width="2"/>
  <text x="615" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Interoception</text>
  <text x="615" y="97" text-anchor="middle" font-size="9" fill="#555">c = 0.78</text>
  <text x="615" y="108" text-anchor="middle" font-size="8" fill="#777">T1 Framework</text>

  <!-- T1.5 nodes -->
  <rect x="130" y="175" width="150" height="55" rx="8" fill="#e4dcc8" stroke="#9b8e6e" stroke-width="2"/>
  <text x="205" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Biophilia</text>
  <text x="205" y="212" text-anchor="middle" font-size="9" fill="#555">c = 0.60</text>
  <text x="205" y="223" text-anchor="middle" font-size="8" fill="#777">T1.5 Domain Theory</text>

  <rect x="420" y="175" width="150" height="55" rx="8" fill="#e4dcc8" stroke="#9b8e6e" stroke-width="2"/>
  <text x="495" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Prospect-Refuge</text>
  <text x="495" y="212" text-anchor="middle" font-size="9" fill="#555">c = 0.45</text>
  <text x="495" y="223" text-anchor="middle" font-size="8" fill="#777">T1.5 (AT CEILING)</text>

  <!-- Edge 1: REDUCTION (T1 → T1.5) — solid green -->
  <line x1="175" y1="115" x2="205" y2="173" stroke="#2a6e2a" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="155" y="148" font-size="8" fill="#2a6e2a" font-weight="bold">① reduction</text>
  <text x="155" y="158" font-size="7" fill="#2a6e2a">α = 0.90</text>

  <line x1="220" y1="115" x2="480" y2="173" stroke="#2a6e2a" stroke-width="2.5" marker-end="url(#a1)"/>

  <!-- Edge 2: BRIDGE WARRANT (T1 → T2) — blue, varied dash -->
  <!-- T2 templates -->
  <rect x="75" y="295" width="155" height="55" rx="8" fill="#d4dce8" stroke="#5b6e8e" stroke-width="2"/>
  <text x="152" y="314" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Daylight → 5-HT</text>
  <text x="152" y="328" text-anchor="middle" font-size="8" fill="#555">c = 0.42 | MECHANISM</text>
  <text x="152" y="340" text-anchor="middle" font-size="7" fill="#2255aa">ceiling = 0.75</text>

  <rect x="260" y="295" width="155" height="55" rx="8" fill="#d4dce8" stroke="#5b6e8e" stroke-width="2"/>
  <text x="337" y="314" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Daylight → Circadian</text>
  <text x="337" y="328" text-anchor="middle" font-size="8" fill="#555">c = 0.43 | EMP_COV</text>
  <text x="337" y="340" text-anchor="middle" font-size="7" fill="#2255aa">ceiling = 0.70</text>

  <rect x="445" y="295" width="155" height="55" rx="8" fill="#d4dce8" stroke="#5b6e8e" stroke-width="2"/>
  <text x="522" y="314" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Ceiling → Creativity</text>
  <text x="522" y="328" text-anchor="middle" font-size="8" fill="#555">c = 0.45 | ANALOGICAL</text>
  <text x="522" y="340" text-anchor="middle" font-size="7" fill="#2255aa">ceiling = 0.45 ← AT LIMIT</text>

  <rect x="635" y="295" width="155" height="55" rx="8" fill="#d4dce8" stroke="#5b6e8e" stroke-width="2"/>
  <text x="712" y="314" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Thermal → Barrett</text>
  <text x="712" y="328" text-anchor="middle" font-size="8" fill="#555">c = 0.57 | FUNCTIONAL</text>
  <text x="712" y="340" text-anchor="middle" font-size="7" fill="#2255aa">ceiling = 0.60</text>

  <!-- Bridge edges -->
  <line x1="395" y1="115" x2="152" y2="293" stroke="#2255aa" stroke-width="2" stroke-dasharray="8,3" marker-end="url(#a2)"/>
  <text x="260" y="210" font-size="8" fill="#2255aa" font-weight="bold">② bridge: MECHANISM</text>

  <line x1="395" y1="115" x2="337" y2="293" stroke="#2255aa" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#a2)"/>

  <line x1="175" y1="115" x2="522" y2="293" stroke="#2255aa" stroke-width="2" stroke-dasharray="2,4" marker-end="url(#a2)"/>
  <text x="370" y="250" font-size="8" fill="#2255aa">② bridge: ANALOGICAL</text>

  <line x1="615" y1="115" x2="712" y2="293" stroke="#2255aa" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#a2)"/>

  <!-- Edge 3: COMPETITION — red zigzag -->
  <path d="M 230 322 L 245 315 L 250 325 L 255 315 L 260 322" stroke="#cc3333" stroke-width="2.5" fill="none" marker-end="url(#a3)"/>
  <text x="248" y="308" text-anchor="middle" font-size="8" fill="#cc3333" font-weight="bold">③ competition</text>
  <text x="248" y="362" text-anchor="middle" font-size="7" fill="#cc3333">α = −0.30 (suppresses both)</text>

  <!-- AXIOM + WORKING MODEL boxes -->
  <rect x="90" y="410" width="140" height="45" rx="6" fill="#e8dcd4" stroke="#8e6e5b" stroke-width="1.5"/>
  <text x="160" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Dose-Response (AX1)</text>
  <text x="160" y="445" text-anchor="middle" font-size="8" fill="#555">c = 0.82 | Axiom</text>

  <rect x="270" y="410" width="140" height="45" rx="6" fill="#e8dcd4" stroke="#8e6e5b" stroke-width="1.5"/>
  <text x="340" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Perceived Ctrl (AX4)</text>
  <text x="340" y="445" text-anchor="middle" font-size="8" fill="#555">c = 0.75 | Axiom</text>

  <rect x="480" y="410" width="170" height="45" rx="6" fill="#f0e8f0" stroke="#8844aa" stroke-width="1.5"/>
  <text x="565" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Barrett-Craig Model</text>
  <text x="565" y="445" text-anchor="middle" font-size="8" fill="#555">c = 0.65 | Working Model</text>

  <!-- Edge 7: AXIOM edges (orange, to all T2) -->
  <line x1="160" y1="410" x2="152" y2="352" stroke="#cc7700" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#a7)"/>
  <line x1="160" y1="410" x2="337" y2="352" stroke="#cc7700" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#a7)"/>
  <line x1="160" y1="410" x2="522" y2="352" stroke="#cc7700" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#a7)"/>
  <line x1="160" y1="410" x2="712" y2="352" stroke="#cc7700" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#a7)"/>
  <text x="100" y="400" font-size="8" fill="#cc7700" font-weight="bold">⑦ axiom edges</text>

  <!-- Edge 6: WORKING MODEL edge (purple) -->
  <line x1="565" y1="410" x2="712" y2="352" stroke="#8844aa" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="655" y="395" font-size="8" fill="#8844aa" font-weight="bold">⑥ working model</text>
  <text x="655" y="405" font-size="7" fill="#8844aa">α = 0.85</text>

  <!-- Edge 4: INTERACTION (dotted grey) -->
  <line x1="230" y1="330" x2="260" y2="340" stroke="#666" stroke-width="1.5" stroke-dasharray="2,3"/>
  <!-- (already close, so just label) -->

  <!-- LEGEND -->
  <rect x="15" y="475" width="810" height="115" rx="6" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="25" y="495" font-size="11" font-weight="bold" fill="#333">Edge Type Legend (all 8 types):</text>

  <line x1="25" y1="515" x2="55" y2="515" stroke="#2a6e2a" stroke-width="2.5"/>
  <text x="60" y="519" font-size="9" fill="#333">① <tspan font-weight="bold">Reduction</tspan> (α=0.90) — T1 explains T1.5; credence flows down</text>

  <line x1="25" y1="533" x2="55" y2="533" stroke="#2255aa" stroke-width="2" stroke-dasharray="8,3"/>
  <text x="60" y="537" font-size="9" fill="#333">② <tspan font-weight="bold">Bridge Warrant</tspan> (α=0.45–0.90) — 7 subtypes: CONSTITUTIVE > MECHANISM > EMP_COV > FUNCTIONAL > CAPACITY > ANALOGICAL > THEO_DEFAULT</text>

  <path d="M 25 551 L 33 545 L 37 555 L 41 545 L 55 551" stroke="#cc3333" stroke-width="2" fill="none"/>
  <text x="60" y="555" font-size="9" fill="#333">③ <tspan font-weight="bold">Competition</tspan> (α=−0.30) — Rivals suppress each other; resolution: VICTORY | COMPROMISE | EQUILIBRIUM</text>

  <line x1="310" y1="515" x2="340" y2="515" stroke="#666" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="345" y="519" font-size="9" fill="#333">④ <tspan font-weight="bold">Interaction</tspan> (α=0.10) — Shared mechanism</text>

  <line x1="555" y1="515" x2="585" y2="515" stroke="#666" stroke-width="2" stroke-dasharray="1,2"/>
  <text x="590" y="519" font-size="9" fill="#333">⑤ <tspan font-weight="bold">Inheritance</tspan> (α=0.95) — Shared parameters</text>

  <line x1="310" y1="533" x2="340" y2="533" stroke="#8844aa" stroke-width="2.5"/>
  <text x="345" y="537" font-size="9" fill="#333">⑥ <tspan font-weight="bold">Working Model</tspan> (α=0.85) — Theoretical commitment constraining templates</text>

  <line x1="310" y1="551" x2="340" y2="551" stroke="#cc7700" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="345" y="555" font-size="9" fill="#333">⑦ <tspan font-weight="bold">Axiom</tspan> (α=0.80) — Meta-parameter modifying all T2</text>

  <line x1="555" y1="551" x2="585" y2="551" stroke="#999" stroke-width="2" stroke-dasharray="6,2,2,2"/>
  <text x="590" y="555" font-size="9" fill="#333">⑧ <tspan font-weight="bold">Partial-out</tspan> (α=0.00) — Scope partition; no credence flow</text>

  <!-- Caption -->
  <text x="420" y="598" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Nodes carry credences, Toulmin structures, and bridge warrant ceilings. Edge types determine how credence propagates. Numbers in parentheses are attenuation factors.</text>
</svg>
