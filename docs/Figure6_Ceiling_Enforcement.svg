<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Georgia, 'Times New Roman', serif">
  <title>Figure 6. Bridge Warrant Ceilings: Evidence Quality Caps Confidence</title>
  <text x="410" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Figure 6. Bridge Warrant Ceilings: Strong Theory Cannot Inflate Weak Evidence</text>

  <!-- LEFT: Without ceilings (what would happen) -->
  <rect x="20" y="40" width="380" height="320" rx="8" fill="#f8f0f0" stroke="#cc5555" stroke-width="2"/>
  <text x="210" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#cc3333">WITHOUT Ceilings (Naive Propagation)</text>

  <!-- PP node -->
  <rect x="130" y="80" width="160" height="45" rx="6" fill="#dce8d4" stroke="#6b8e5b" stroke-width="2"/>
  <text x="210" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Predictive Processing</text>
  <text x="210" y="117" text-anchor="middle" font-size="10" fill="#333">c = 0.85 (well-established)</text>

  <!-- Arrow with big alpha -->
  <line x1="210" y1="125" x2="210" y2="155" stroke="#6b8e5b" stroke-width="3"/>
  <text x="235" y="145" font-size="10" fill="#6b8e5b" font-weight="bold">α = 0.90</text>
  <text x="235" y="157" font-size="9" fill="#6b8e5b">(reduction)</text>

  <!-- Arrow down -->
  <line x1="210" y1="155" x2="210" y2="170" stroke="#6b8e5b" stroke-width="3" marker-end="url(#ac)"/>

  <defs>
    <marker id="ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b8e5b"/></marker>
    <marker id="acb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2255aa"/></marker>
  </defs>

  <!-- Ceiling-Creativity without ceiling -->
  <rect x="100" y="175" width="220" height="55" rx="6" fill="#f0d0d0" stroke="#cc5555" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc3333">Ceiling → Creativity</text>
  <text x="210" y="210" text-anchor="middle" font-size="10" fill="#cc3333">c → 0.68 ← INFLATED!</text>
  <text x="210" y="222" text-anchor="middle" font-size="8" fill="#cc3333">ANALOGICAL bridge (one study, failed replications)</text>

  <!-- Warning -->
  <rect x="50" y="245" width="320" height="100" rx="4" fill="#fff0f0" stroke="#cc5555" stroke-width="1"/>
  <text x="210" y="265" text-anchor="middle" font-size="10" font-weight="bold" fill="#cc3333">⚠ PROBLEM:</text>
  <text x="60" y="282" font-size="9" fill="#555">An architect sees c = 0.68 and thinks</text>
  <text x="60" y="296" font-size="9" fill="#555">"moderately confident — worth acting on."</text>
  <text x="60" y="310" font-size="9" fill="#555">But the evidence is a SINGLE priming study</text>
  <text x="60" y="324" font-size="9" fill="#555">with FAILED REPLICATIONS. The number lies.</text>
  <text x="60" y="338" font-size="9" fill="#cc3333" font-weight="bold">Strong theory inflated weak evidence.</text>

  <!-- RIGHT: With ceilings (what actually happens) -->
  <rect x="420" y="40" width="380" height="320" rx="8" fill="#f0f8f0" stroke="#2a8e2a" stroke-width="2"/>
  <text x="610" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a6e2a">WITH Ceilings (CMR Algorithm 1)</text>

  <!-- PP node -->
  <rect x="530" y="80" width="160" height="45" rx="6" fill="#dce8d4" stroke="#6b8e5b" stroke-width="2"/>
  <text x="610" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Predictive Processing</text>
  <text x="610" y="117" text-anchor="middle" font-size="10" fill="#333">c = 0.85 (well-established)</text>

  <!-- Arrow with alpha -->
  <line x1="610" y1="125" x2="610" y2="148" stroke="#6b8e5b" stroke-width="3"/>
  <text x="635" y="140" font-size="10" fill="#6b8e5b" font-weight="bold">α = 0.90</text>

  <!-- CEILING LINE -->
  <line x1="440" y1="160" x2="780" y2="160" stroke="#cc7700" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="445" y="155" font-size="10" font-weight="bold" fill="#cc7700">ANALOGICAL CEILING = 0.45</text>

  <!-- Arrow blocked -->
  <line x1="610" y1="148" x2="610" y2="158" stroke="#6b8e5b" stroke-width="3"/>
  <text x="640" y="175" font-size="9" fill="#cc7700" font-weight="bold">BLOCKED</text>
  <line x1="610" y1="163" x2="610" y2="180" stroke="#cc7700" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#acb)"/>

  <!-- Ceiling-Creativity with ceiling -->
  <rect x="500" y="185" width="220" height="55" rx="6" fill="#d8f0d8" stroke="#2a8e2a" stroke-width="2"/>
  <text x="610" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6e2a">Ceiling → Creativity</text>
  <text x="610" y="220" text-anchor="middle" font-size="10" fill="#2a6e2a">c = 0.45 ← AT CEILING</text>
  <text x="610" y="232" text-anchor="middle" font-size="8" fill="#2a6e2a">Honest: reflects actual evidence quality</text>

  <!-- Explanation -->
  <rect x="450" y="255" width="320" height="90" rx="4" fill="#f0fff0" stroke="#2a8e2a" stroke-width="1"/>
  <text x="610" y="275" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a6e2a">✓ CORRECT:</text>
  <text x="460" y="292" font-size="9" fill="#555">No matter how well-supported PP is,</text>
  <text x="460" y="306" font-size="9" fill="#555">an ANALOGICAL bridge can only carry so</text>
  <text x="460" y="320" font-size="9" fill="#555">much evidential weight. To raise the ceiling,</text>
  <text x="460" y="334" font-size="9" fill="#555">you need MECHANISM evidence (ceiling = 0.75).</text>

  <!-- Bottom: the hierarchy of ceilings -->
  <rect x="20" y="366" width="780" height="12" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="0.5"/>
  <!-- gradient bar -->
  <rect x="20" y="366" width="100" height="12" rx="2" fill="#ff8888"/>
  <rect x="120" y="366" width="130" height="12" fill="#ffaa66"/>
  <rect x="250" y="366" width="130" height="12" fill="#ffcc44"/>
  <rect x="380" y="366" width="130" height="12" fill="#aadd44"/>
  <rect x="510" y="366" width="140" height="12" fill="#66cc66"/>
  <rect x="650" y="366" width="150" height="12" rx="2" fill="#44aa44"/>

  <text x="70" y="364" text-anchor="middle" font-size="7.5" fill="#333">THEO_DEF</text>
  <text x="70" y="390" text-anchor="middle" font-size="8" fill="#666">0.50</text>
  <text x="185" y="364" text-anchor="middle" font-size="7.5" fill="#333">ANALOGICAL</text>
  <text x="185" y="390" text-anchor="middle" font-size="8" fill="#666">0.45</text>
  <text x="315" y="364" text-anchor="middle" font-size="7.5" fill="#333">CAPACITY</text>
  <text x="315" y="390" text-anchor="middle" font-size="8" fill="#666">0.55</text>
  <text x="445" y="364" text-anchor="middle" font-size="7.5" fill="#333">FUNCTIONAL</text>
  <text x="445" y="390" text-anchor="middle" font-size="8" fill="#666">0.60</text>
  <text x="580" y="364" text-anchor="middle" font-size="7.5" fill="#333">EMP_COV</text>
  <text x="580" y="390" text-anchor="middle" font-size="8" fill="#666">0.70</text>
  <text x="725" y="364" text-anchor="middle" font-size="7.5" fill="#333">MECHANISM / CONSTITUTIVE</text>
  <text x="725" y="390" text-anchor="middle" font-size="8" fill="#666">0.75 / 0.90</text>
</svg>
