<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Georgia, 'Times New Roman', serif">
  <title>Figure 4. Two Kinds of Uncertainty: Same Number, Different Meanings</title>
  <text x="410" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Figure 4. Two Kinds of Uncertainty: Same Number, Different Meanings</text>

  <!-- CLAIM A panel -->
  <rect x="20" y="45" width="380" height="310" rx="8" fill="#f8f4e8" stroke="#aa8822" stroke-width="2"/>
  <text x="210" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d00">CLAIM A: Credence = 0.35</text>
  <text x="210" y="86" text-anchor="middle" font-size="11" fill="#aa8822" font-weight="bold">MECHANISM Bridge Warrant</text>

  <!-- Mechanism chain -->
  <rect x="40" y="100" width="85" height="32" rx="4" fill="#e8e0c8" stroke="#aa8822" stroke-width="1"/>
  <text x="82" y="120" text-anchor="middle" font-size="9" fill="#333">Daylight</text>

  <rect x="145" y="100" width="85" height="32" rx="4" fill="#e8e0c8" stroke="#aa8822" stroke-width="1"/>
  <text x="187" y="113" text-anchor="middle" font-size="8" fill="#333">Retinal</text>
  <text x="187" y="125" text-anchor="middle" font-size="8" fill="#333">ipRGC</text>

  <rect x="250" y="100" width="85" height="32" rx="4" fill="#e8e0c8" stroke="#aa8822" stroke-width="1"/>
  <text x="292" y="113" text-anchor="middle" font-size="8" fill="#333">Raphe</text>
  <text x="292" y="125" text-anchor="middle" font-size="8" fill="#333">Nuclei</text>

  <line x1="125" y1="116" x2="143" y2="116" stroke="#aa8822" stroke-width="1.5" marker-end="url(#am)"/>
  <line x1="230" y1="116" x2="248" y2="116" stroke="#aa8822" stroke-width="1.5" marker-end="url(#am)"/>

  <rect x="145" y="145" width="85" height="32" rx="4" fill="#e8e0c8" stroke="#aa8822" stroke-width="1"/>
  <text x="187" y="158" text-anchor="middle" font-size="8" fill="#333">5-HT</text>
  <text x="187" y="170" text-anchor="middle" font-size="8" fill="#333">Synthesis</text>

  <rect x="250" y="145" width="85" height="32" rx="4" fill="#e8e0c8" stroke="#aa8822" stroke-width="1"/>
  <text x="292" y="158" text-anchor="middle" font-size="8" fill="#333">Positive</text>
  <text x="292" y="170" text-anchor="middle" font-size="8" fill="#333">Mood</text>

  <line x1="292" y1="132" x2="230" y2="145" stroke="#aa8822" stroke-width="1.5" marker-end="url(#am)"/>
  <line x1="230" y1="161" x2="248" y2="161" stroke="#aa8822" stroke-width="1.5" marker-end="url(#am)"/>

  <defs>
    <marker id="am" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#aa8822"/></marker>
    <marker id="ab" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#2266aa"/></marker>
  </defs>

  <!-- What it means -->
  <text x="40" y="200" font-size="10" font-weight="bold" fill="#333">What 0.35 means:</text>
  <text x="40" y="215" font-size="9" fill="#555">The causal pathway is well-characterised</text>
  <text x="40" y="228" font-size="9" fill="#555">in the laboratory. We are uncertain whether</text>
  <text x="40" y="241" font-size="9" fill="#555">it operates at sufficient magnitude in real</text>
  <text x="40" y="254" font-size="9" fill="#555">buildings with real occupants.</text>

  <!-- What would help -->
  <rect x="40" y="268" width="340" height="75" rx="4" fill="#e8f0d8" stroke="#6b8e5b" stroke-width="1"/>
  <text x="50" y="286" font-size="10" font-weight="bold" fill="#3a6a2a">What raises this credence:</text>
  <text x="50" y="302" font-size="9" fill="#555">Measure the mechanism IN BUILDINGS —</text>
  <text x="50" y="315" font-size="9" fill="#555">ambulatory neurochemical monitoring, or</text>
  <text x="50" y="328" font-size="9" fill="#555">behavioural outcomes in buildings with</text>
  <text x="50" y="341" font-size="9" fill="#555">known daylight parameters.</text>

  <!-- CLAIM B panel -->
  <rect x="420" y="45" width="380" height="310" rx="8" fill="#e8f0f8" stroke="#2266aa" stroke-width="2"/>
  <text x="610" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a8a">CLAIM B: Credence = 0.35</text>
  <text x="610" y="86" text-anchor="middle" font-size="11" fill="#2266aa" font-weight="bold">ANALOGICAL Bridge Warrant</text>

  <!-- Analogy diagram -->
  <rect x="440" y="100" width="160" height="70" rx="6" fill="#d8e4f0" stroke="#2266aa" stroke-width="1.5"/>
  <text x="520" y="118" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Source Domain</text>
  <text x="520" y="133" text-anchor="middle" font-size="8" fill="#555">Drug → Mesolimbic DA →</text>
  <text x="520" y="146" text-anchor="middle" font-size="8" fill="#555">Incentive Sensitisation</text>
  <text x="520" y="159" text-anchor="middle" font-size="7" fill="#888">(well-established)</text>

  <rect x="630" y="100" width="160" height="70" rx="6" fill="#d8e4f0" stroke="#2266aa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="710" y="118" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Target Domain</text>
  <text x="710" y="133" text-anchor="middle" font-size="8" fill="#555">Architecture → Mesolimbic DA →</text>
  <text x="710" y="146" text-anchor="middle" font-size="8" fill="#555">Place Attachment</text>
  <text x="710" y="159" text-anchor="middle" font-size="7" fill="#888">(assumed by analogy)</text>

  <!-- Analogy arrow -->
  <text x="615" y="100" text-anchor="middle" font-size="20" fill="#2266aa">≈</text>
  <text x="615" y="183" text-anchor="middle" font-size="8" fill="#cc3333">Shared substrate (DA)</text>
  <text x="615" y="195" text-anchor="middle" font-size="8" fill="#cc3333">but different dynamics?</text>

  <!-- What it means -->
  <text x="440" y="218" font-size="10" font-weight="bold" fill="#333">What 0.35 means:</text>
  <text x="440" y="233" font-size="9" fill="#555">We are reasoning from a parallel case.</text>
  <text x="440" y="246" font-size="9" fill="#555">The neural substrate is shared, but the</text>
  <text x="440" y="259" font-size="9" fill="#555">analogy itself may not hold — the domains</text>
  <text x="440" y="272" font-size="9" fill="#555">may differ in ways that break it.</text>

  <!-- What would help -->
  <rect x="440" y="283" width="340" height="60" rx="4" fill="#f8e8e8" stroke="#cc5555" stroke-width="1"/>
  <text x="450" y="301" font-size="10" font-weight="bold" fill="#993333">What raises this credence:</text>
  <text x="450" y="317" font-size="9" fill="#555">Establish that the analogy ACTUALLY HOLDS —</text>
  <text x="450" y="330" font-size="9" fill="#555">that the same mechanism operates in both</text>
  <text x="450" y="343" font-size="9" fill="#555">domains, not just that they look similar.</text>

  <!-- Bottom summary -->
  <rect x="20" y="365" width="780" height="45" rx="6" fill="#fff0e0" stroke="#cc7700" stroke-width="1.5"/>
  <text x="410" y="383" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5500">Same number. Different meanings. Different research programmes.</text>
  <text x="410" y="399" text-anchor="middle" font-size="10" fill="#666">Claim A needs more DATA (measure the mechanism in buildings). Claim B needs better THEORY (prove the analogy holds).</text>
  <text x="410" y="410" text-anchor="middle" font-size="9" fill="#888">The BN sees only "0.35". The web sees the warrant type — and knows what to do about it.</text>
</svg>
