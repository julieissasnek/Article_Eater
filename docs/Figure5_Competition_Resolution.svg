<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Georgia, 'Times New Roman', serif">
  <title>Figure 5. Competition Resolution: Three Outcomes</title>
  <text x="410" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Figure 5. Competition Resolution: Three Possible Outcomes</text>

  <defs>
    <marker id="ar" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#555"/></marker>
  </defs>

  <!-- STARTING STATE -->
  <rect x="260" y="38" width="300" height="80" rx="6" fill="#fff8f0" stroke="#cc7700" stroke-width="2"/>
  <text x="410" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">STARTING STATE: Two Competing Templates</text>

  <rect x="275" y="66" width="115" height="40" rx="4" fill="#f0e0c8" stroke="#cc7700"/>
  <text x="332" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Theory A</text>
  <text x="332" y="97" text-anchor="middle" font-size="8" fill="#555">c = 0.50</text>

  <path d="M 397 80 L 410 73 L 410 87 L 423 80" stroke="#cc3333" stroke-width="2" fill="none"/>

  <rect x="430" y="66" width="115" height="40" rx="4" fill="#f0e0c8" stroke="#cc7700"/>
  <text x="487" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Theory B</text>
  <text x="487" y="97" text-anchor="middle" font-size="8" fill="#555">c = 0.55</text>

  <!-- Three arrows down -->
  <line x1="200" y1="118" x2="135" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="410" y1="118" x2="410" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="620" y1="118" x2="685" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="152" y="143" font-size="9" fill="#555">New evidence</text>
  <text x="152" y="153" font-size="9" fill="#555">strongly favours A</text>
  <text x="396" y="143" font-size="9" fill="#555">Evidence supports</text>
  <text x="396" y="153" font-size="9" fill="#555">both in different domains</text>
  <text x="656" y="143" font-size="9" fill="#555">Evidence cannot</text>
  <text x="656" y="153" font-size="9" fill="#555">discriminate</text>

  <!-- OUTCOME 1: VICTORY -->
  <rect x="15" y="165" width="260" height="315" rx="8" fill="#e8f5e8" stroke="#2a8e2a" stroke-width="2"/>
  <text x="145" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a6e2a">VICTORY</text>
  <text x="145" y="203" text-anchor="middle" font-size="9" fill="#555">Gap > 0.30 threshold</text>

  <rect x="40" y="215" width="100" height="45" rx="5" fill="#c8e8c8" stroke="#2a8e2a" stroke-width="2"/>
  <text x="90" y="234" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a6e2a">Theory A ✓</text>
  <text x="90" y="250" text-anchor="middle" font-size="9" fill="#333">c = 0.70</text>

  <rect x="165" y="215" width="100" height="45" rx="5" fill="#f0e0e0" stroke="#cc3333" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="215" y="234" text-anchor="middle" font-size="10" fill="#999">Theory B ✗</text>
  <text x="215" y="250" text-anchor="middle" font-size="9" fill="#999">c = 0.15</text>

  <text x="35" y="282" font-size="9" fill="#555">Example: Phlogiston vs. Oxygen.</text>
  <text x="35" y="296" font-size="9" fill="#555">Lavoisier's evidence was decisive.</text>
  <text x="35" y="310" font-size="9" fill="#555">Loser is suppressed; winner gains.</text>

  <rect x="35" y="325" width="220" height="65" rx="4" fill="#fff" stroke="#2a8e2a" stroke-width="1"/>
  <text x="45" y="342" font-size="9" font-weight="bold" fill="#2a6e2a">Effect on coherence:</text>
  <text x="45" y="358" font-size="9" fill="#555">Positive — tension resolved.</text>
  <text x="45" y="374" font-size="9" fill="#555">Competition edge → +0.5 × w</text>
  <text x="45" y="386" font-size="9" fill="#555">in Algorithm 3.</text>

  <text x="35" y="415" font-size="9" font-weight="bold" fill="#333">CMR example:</text>
  <text x="35" y="430" font-size="9" fill="#555">ART demotion from T1 to T1.5</text>
  <text x="35" y="445" font-size="9" fill="#555">(PP provides better explanation</text>
  <text x="35" y="460" font-size="9" fill="#555">of attention restoration effects)</text>

  <!-- OUTCOME 2: COMPROMISE -->
  <rect x="290" y="165" width="260" height="315" rx="8" fill="#e8e8f5" stroke="#4444aa" stroke-width="2"/>
  <text x="420" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#3333aa">COMPROMISE</text>
  <text x="420" y="203" text-anchor="middle" font-size="9" fill="#555">Domain partition detected</text>

  <rect x="310" y="215" width="100" height="55" rx="5" fill="#d8d8f0" stroke="#4444aa" stroke-width="1.5"/>
  <text x="360" y="232" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Theory A</text>
  <text x="360" y="247" text-anchor="middle" font-size="9" fill="#333">c = 0.55</text>
  <text x="360" y="262" text-anchor="middle" font-size="8" fill="#4444aa">Domain: posterior</text>

  <rect x="430" y="215" width="100" height="55" rx="5" fill="#d8d8f0" stroke="#4444aa" stroke-width="1.5"/>
  <text x="480" y="232" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Theory B</text>
  <text x="480" y="247" text-anchor="middle" font-size="9" fill="#333">c = 0.60</text>
  <text x="480" y="262" text-anchor="middle" font-size="8" fill="#4444aa">Domain: anterior</text>

  <text x="420" y="232" text-anchor="middle" font-size="14" fill="#4444aa">|</text>

  <text x="310" y="292" font-size="9" fill="#555">Both survive with restricted scope.</text>
  <text x="310" y="306" font-size="9" fill="#555">New Working Model node created.</text>
  <text x="310" y="320" font-size="9" fill="#555">Partial-out edge prevents</text>
  <text x="310" y="334" font-size="9" fill="#555">double-counting.</text>

  <rect x="310" y="345" width="220" height="50" rx="4" fill="#fff" stroke="#4444aa" stroke-width="1"/>
  <text x="320" y="362" font-size="9" font-weight="bold" fill="#3333aa">Effect on coherence:</text>
  <text x="320" y="378" font-size="9" fill="#555">Strongly positive — tension resolved</text>
  <text x="320" y="390" font-size="9" fill="#555">AND hypothesis space expanded.</text>

  <text x="310" y="415" font-size="9" font-weight="bold" fill="#333">CMR example:</text>
  <text x="310" y="430" font-size="9" fill="#555">Barrett-Craig two-stage model.</text>
  <text x="310" y="445" font-size="9" fill="#555">Craig holds for posterior insula</text>
  <text x="310" y="460" font-size="9" fill="#555">(early); Barrett for anterior (late).</text>

  <!-- OUTCOME 3: EQUILIBRIUM -->
  <rect x="565" y="165" width="240" height="315" rx="8" fill="#f5e8e8" stroke="#cc5555" stroke-width="2"/>
  <text x="685" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#aa3333">EQUILIBRIUM</text>
  <text x="685" y="203" text-anchor="middle" font-size="9" fill="#555">Neither wins; gap < 0.30</text>

  <rect x="590" y="215" width="90" height="45" rx="5" fill="#f0d8d8" stroke="#cc5555" stroke-width="1.5"/>
  <text x="635" y="234" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Theory A</text>
  <text x="635" y="250" text-anchor="middle" font-size="9" fill="#333">c = 0.42</text>

  <path d="M 687 232 L 700 225 L 700 239 L 713 232" stroke="#cc3333" stroke-width="2" fill="none"/>

  <rect x="720" y="215" width="90" height="45" rx="5" fill="#f0d8d8" stroke="#cc5555" stroke-width="1.5"/>
  <text x="765" y="234" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">Theory B</text>
  <text x="765" y="250" text-anchor="middle" font-size="9" fill="#333">c = 0.43</text>

  <text x="585" y="282" font-size="9" fill="#555">Both survive at suppressed</text>
  <text x="585" y="296" font-size="9" fill="#555">credences. Competition edge</text>
  <text x="585" y="310" font-size="9" fill="#555">remains UNRESOLVED. Flagged</text>
  <text x="585" y="324" font-size="9" fill="#555">for imprecise probability.</text>

  <rect x="585" y="340" width="205" height="50" rx="4" fill="#fff" stroke="#cc5555" stroke-width="1"/>
  <text x="595" y="357" font-size="9" font-weight="bold" fill="#aa3333">Effect on coherence:</text>
  <text x="595" y="373" font-size="9" fill="#555">Negative — unresolved tension</text>
  <text x="595" y="385" font-size="9" fill="#555">drags coherence down by −closeness × w.</text>

  <text x="585" y="413" font-size="9" font-weight="bold" fill="#333">CMR example:</text>
  <text x="585" y="428" font-size="9" fill="#555">5-HT vs. Circadian accounts of</text>
  <text x="585" y="443" font-size="9" fill="#555">daylight-mood. Neither dominates.</text>
  <text x="585" y="458" font-size="9" fill="#555">VOI ranks this #1 for resolution.</text>

  <!-- Caption -->
  <text x="410" y="495" text-anchor="middle" font-size="9" fill="#666" font-style="italic">Algorithm 2 evaluates net support (credence + warrant bonus) to determine outcome. Only EQUILIBRIUM contributes negatively to coherence (Algorithm 3).</text>
</svg>
