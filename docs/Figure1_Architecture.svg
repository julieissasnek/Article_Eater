<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Georgia, 'Times New Roman', serif">
  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Figure 1. Three-Component Architecture: Typed Web of Belief, Bayesian Network, and Empirical Testing</text>

  <!-- WEB OF BELIEF box -->
  <rect x="30" y="55" width="360" height="340" rx="8" fill="#f8f6f0" stroke="#333" stroke-width="2"/>
  <text x="210" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">TYPED WEB OF BELIEF</text>
  <text x="210" y="96" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Mechanism-based causal reasoning</text>

  <!-- Tier hierarchy -->
  <rect x="50" y="110" width="320" height="35" rx="4" fill="#dce8d4" stroke="#6b8e5b" stroke-width="1.2"/>
  <text x="210" y="132" text-anchor="middle" font-size="11" fill="#333">T1 Frameworks (10): PP, Salience, DMN, Neuromod, …</text>

  <rect x="50" y="155" width="320" height="35" rx="4" fill="#e4dcc8" stroke="#9b8e6e" stroke-width="1.2"/>
  <text x="210" y="177" text-anchor="middle" font-size="11" fill="#333">T1.5 Domain Theories (10): Biophilia, ART, Awe, …</text>

  <rect x="50" y="200" width="320" height="35" rx="4" fill="#d4dce8" stroke="#5b6e8e" stroke-width="1.2"/>
  <text x="210" y="222" text-anchor="middle" font-size="11" fill="#333">T2 Calibrated Templates (~93): mechanism chains</text>

  <rect x="50" y="245" width="150" height="30" rx="4" fill="#e8dcd4" stroke="#8e6e5b" stroke-width="1.2"/>
  <text x="125" y="264" text-anchor="middle" font-size="10" fill="#333">Axioms (8)</text>

  <rect x="220" y="245" width="150" height="30" rx="4" fill="#e8dcd4" stroke="#8e6e5b" stroke-width="1.2"/>
  <text x="295" y="264" text-anchor="middle" font-size="10" fill="#333">Working Models (2)</text>

  <!-- Edge types box -->
  <rect x="50" y="285" width="320" height="100" rx="4" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="60" y="302" font-size="10" font-weight="bold" fill="#333">8 Typed Edges:</text>
  <text x="60" y="318" font-size="9.5" fill="#555">1. Reduction  2. Bridge Warrant (7 subtypes)  3. Competition</text>
  <text x="60" y="334" font-size="9.5" fill="#555">4. Cross-template  5. Inheritance  6. Working Model</text>
  <text x="60" y="350" font-size="9.5" fill="#555">7. Axiom  8. Partial-out</text>
  <text x="60" y="370" font-size="9.5" fill="#666" font-style="italic">Each node: credence [0,1] + Toulmin provenance + warrant type</text>

  <!-- BAYESIAN NETWORK box -->
  <rect x="440" y="55" width="350" height="200" rx="8" fill="#f0f4f8" stroke="#333" stroke-width="2"/>
  <text x="615" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">BAYESIAN NETWORK</text>
  <text x="615" y="96" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Variable-based causal reasoning</text>

  <!-- BN nodes -->
  <circle cx="490" cy="140" r="18" fill="#c5d5e8" stroke="#456" stroke-width="1.5"/>
  <text x="490" y="144" text-anchor="middle" font-size="8" fill="#333">Daylight</text>

  <circle cx="570" cy="140" r="18" fill="#c5d5e8" stroke="#456" stroke-width="1.5"/>
  <text x="570" y="144" text-anchor="middle" font-size="8" fill="#333">Ceiling</text>

  <circle cx="650" cy="140" r="18" fill="#c5d5e8" stroke="#456" stroke-width="1.5"/>
  <text x="650" y="144" text-anchor="middle" font-size="8" fill="#333">Green</text>

  <circle cx="730" cy="140" r="18" fill="#c5d5e8" stroke="#456" stroke-width="1.5"/>
  <text x="730" y="144" text-anchor="middle" font-size="8" fill="#333">Noise</text>

  <circle cx="530" cy="200" r="18" fill="#e8d5c5" stroke="#864" stroke-width="1.5"/>
  <text x="530" y="204" text-anchor="middle" font-size="8" fill="#333">Mood</text>

  <circle cx="610" cy="200" r="18" fill="#e8d5c5" stroke="#864" stroke-width="1.5"/>
  <text x="610" y="204" text-anchor="middle" font-size="8" fill="#333">Creatv</text>

  <circle cx="690" cy="200" r="18" fill="#e8d5c5" stroke="#864" stroke-width="1.5"/>
  <text x="690" y="204" text-anchor="middle" font-size="8" fill="#333">Stress</text>

  <!-- BN edges -->
  <line x1="490" y1="158" x2="530" y2="182" stroke="#456" stroke-width="1.2" marker-end="url(#arrowBN)"/>
  <line x1="570" y1="158" x2="610" y2="182" stroke="#456" stroke-width="1.2" marker-end="url(#arrowBN)"/>
  <line x1="570" y1="158" x2="530" y2="182" stroke="#456" stroke-width="1.2" marker-end="url(#arrowBN)"/>
  <line x1="650" y1="158" x2="610" y2="182" stroke="#456" stroke-width="1.2" marker-end="url(#arrowBN)"/>
  <line x1="650" y1="158" x2="690" y2="182" stroke="#456" stroke-width="1.2" marker-end="url(#arrowBN)"/>
  <line x1="730" y1="158" x2="690" y2="182" stroke="#456" stroke-width="1.2" marker-end="url(#arrowBN)"/>

  <!-- CPT label -->
  <text x="615" y="235" text-anchor="middle" font-size="9.5" fill="#555">Nodes carry CPTs (aleatory probabilities only)</text>
  <text x="615" y="248" text-anchor="middle" font-size="9.5" fill="#555">No provenance, no warrant types, no Toulmin structure</text>

  <!-- PROJECTION ARROW (Web → BN) -->
  <defs>
    <marker id="arrowProj" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c44"/>
    </marker>
    <marker id="arrowFeed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#46a"/>
    </marker>
    <marker id="arrowBN" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#456"/>
    </marker>
    <marker id="arrowTest" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5a5"/>
    </marker>
  </defs>

  <!-- Projection arrow -->
  <path d="M 390 160 C 420 130, 430 130, 440 140" stroke="#c44" stroke-width="2.5" fill="none" marker-end="url(#arrowProj)"/>
  <text x="415" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#c44">π</text>
  <text x="415" y="106" text-anchor="middle" font-size="9" fill="#c44">Projection</text>
  <text x="415" y="135" text-anchor="middle" font-size="8" fill="#c44">(lossy)</text>

  <!-- TESTING box -->
  <rect x="440" y="290" width="350" height="100" rx="8" fill="#f0f8f0" stroke="#333" stroke-width="2"/>
  <text x="615" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">EMPIRICAL TESTING</text>
  <text x="615" y="331" text-anchor="middle" font-size="10" fill="#555" font-style="italic">External accountability</text>
  <text x="615" y="352" font-size="9.5" fill="#555" text-anchor="middle">L1: Internal consistency  L2: Retrodiction  L3: Prediction</text>
  <text x="615" y="368" font-size="9.5" fill="#555" text-anchor="middle">L4: Cross-domain transfer  L5: Adversarial stress</text>
  <text x="615" y="382" font-size="9" fill="#666" font-style="italic" text-anchor="middle">Checks predictions against reality (Olsson's challenge)</text>

  <!-- BN → Testing arrow -->
  <line x1="615" y1="258" x2="615" y2="287" stroke="#5a5" stroke-width="2" marker-end="url(#arrowTest)"/>
  <text x="636" y="275" font-size="9" fill="#5a5">Predictions</text>

  <!-- Testing → Web feedback arrow -->
  <path d="M 440 380 C 350 420, 300 420, 210 400" stroke="#46a" stroke-width="2.5" fill="none" marker-end="url(#arrowFeed)"/>
  <text x="320" y="430" text-anchor="middle" font-size="10" font-weight="bold" fill="#46a">Feedback</text>
  <text x="320" y="445" text-anchor="middle" font-size="8.5" fill="#46a">Discrepancies → Algorithm 4 (Structural Revision)</text>

  <!-- Algorithms label -->
  <rect x="50" y="398" width="320" height="55" rx="4" fill="#f5f0e8" stroke="#999" stroke-width="1"/>
  <text x="210" y="418" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Six Polynomial-Time Algorithms</text>
  <text x="210" y="434" text-anchor="middle" font-size="9" fill="#555">1. Credence Prop.  2. Competition  3. Coherence</text>
  <text x="210" y="448" text-anchor="middle" font-size="9" fill="#555">4. Structural Rev.  5. Value of Info  6. BN Projection</text>

  <!-- Epistemic vs Aleatory labels -->
  <rect x="30" y="470" width="360" height="30" rx="4" fill="#fff8e0" stroke="#c90" stroke-width="1.2"/>
  <text x="210" y="490" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d00">EPISTEMIC probability (state of knowledge)</text>

  <rect x="440" y="470" width="350" height="30" rx="4" fill="#e0f0ff" stroke="#07a" stroke-width="1.2"/>
  <text x="615" y="490" text-anchor="middle" font-size="10" font-weight="bold" fill="#005580">ALEATORY probability (world frequencies)</text>

  <!-- Caption -->
  <text x="410" y="515" text-anchor="middle" font-size="9" fill="#666" font-style="italic">The projection π is surjective but not injective: multiple web states can map to the same BN. Epistemic provenance is lost in translation.</text>
</svg>