<!doctype html><html><head><meta charset="utf-8"><title>Usage HUD</title>
<style>body{font-family:system-ui,Segoe UI,Arial;margin:24px} table{border-collapse:collapse;width:100%} th,td{border:1px solid #ddd;padding:8px} th{background:#f5f5f5}</style>
</head><body>
<div class="nav"><a href="interactions.html" class="nav-link">Interactions</a></div>

<h1>API Usage — Me</h1>
<label>User ID <input id="uid" value="anon"></label><button onclick="load()">Refresh</button>
<table id="tbl"><thead><tr><th>When</th><th>Provider</th><th>Model</th><th>Tokens In</th><th>Tokens Out</th><th>Cost ($)</th></tr></thead><tbody></tbody></table>
<script>
async function load(){
  const uid=document.getElementById('uid').value||'anon';
  const res=await fetch(`/usage/me?user_id=${encodeURIComponent(uid)}`);
  const js=await res.json();
  const tb=document.querySelector("#tbl tbody"); tb.innerHTML="";
  (js.events||[]).forEach(e=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${e.ts||""}</td><td>${e.provider||""}</td><td>${e.model||""}</td><td>${e.in||0}</td><td>${e.out||0}</td><td>${(e.cost||0).toFixed?e.cost.toFixed(4):e.cost}</td>`;
    tb.appendChild(tr);
  });
} load();
</script></body></html>
