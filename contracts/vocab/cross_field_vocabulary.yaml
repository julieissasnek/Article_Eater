# Cross-Field Vocabulary Mapping
# ================================
# Maps CNfA concepts to terminology in adjacent fields.
# Used by VOI-driven search to find relevant literature across disciplines.
#
# Created: February 8, 2026
# Sprint: TODO 3 (VOI-Driven Search)
# Lane: E

version: "1.0.0"
created: "2026-02-08"
description: |
  Scientific fields use different terminology for related concepts.
  This vocabulary enables cross-field literature search by mapping
  CNfA terms to equivalent or related terms in adjacent disciplines.

