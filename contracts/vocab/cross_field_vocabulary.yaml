# ===========================================================================
# METHODOLOGICAL TERMS
# ===========================================================================

measurement_methods:
  self_report:
    cnfa_terms: ["self-report", "questionnaire", "survey"]
    psychology_terms: ["psychometric", "rating scale", "Likert"]
    specific_instruments:
      - "POMS (Profile of Mood States)"
      - "PSS (Perceived Stress Scale)"
      - "STAI (State-Trait Anxiety Inventory)"
      - "ROS (Restoration Outcome Scale)"
      - "PRS (Perceived Restorativeness Scale)"

  physiological:
    cnfa_terms: ["physiological", "biomarker"]
    psychology_terms: ["psychophysiological"]
    specific_measures:
      - "cortisol"
      - "heart rate"
      - "heart rate variability"
      - "blood pressure"
      - "skin conductance"
      - "EEG"
      - "fMRI"

  behavioral:
    cnfa_terms: ["behavioral", "performance"]
    psychology_terms: ["cognitive task", "reaction time"]
    specific_tasks:
      - "Stroop task"
      - "n-back"
      - "attention network test"
      - "d2 test"
      - "SART (Sustained Attention to Response)"


# ===========================================================================
# SEARCH QUERY TEMPLATES
# ===========================================================================

query_templates:
  scope_boundary:
    description: "Find studies testing scope limitations"
    template: '"{concept}" AND ({missing_scope} OR {related_terms}) AND {outcome}'
    examples:
      - '"{nature_restoration}" AND (children OR pediatric) AND stress'
      - '"{attention_restoration}" AND (elderly OR aging) AND cognition'

  mechanism_test:
    description: "Find studies testing underlying mechanisms"
    template: '"{mechanism}" AND ({measurement_terms}) AND {theory}'
    examples:
      - '"{attention_restoration}" AND (fMRI OR EEG) AND "directed attention"'
      - '"{stress_recovery}" AND (cortisol OR HRV) AND psychophysiological'

  bridge_evidence:
    description: "Find studies bridging two theories"
    template: '"{theory1_terms}" AND "{theory2_terms}" AND ({compare_terms})'
    examples:
      - '"{stress_recovery}" AND "{attention_restoration}" AND (compare OR both)'
      - '"{biophilia}" AND "{prospect_refuge}" AND (evolutionary OR preference)'

  null_results:
    description: "Find studies with null or negative results"
    template: '"{concept}" AND ({null_terms})'
    null_terms:
      - "no significant"
      - "failed to replicate"
      - "not supported"
      - "null result"
      - "no effect"

  replication:
    description: "Find replication studies"
    template: '"{concept}" AND ({replication_terms})'
    replication_terms:
      - "replication"
      - "replicate"
      - "reproducibility"
      - "pre-registered"
      - "registered report"


