[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E","F","I"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["src", "app"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv/",
    ".venv/",
    "__pycache__/",
    "tests/",
    "quarantine/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src", "app"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/quarantine/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 0
show_missing = true

[tool.coverage.html]
directory = "htmlcov"