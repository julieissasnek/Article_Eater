# Expected constraints between beliefs
expected_constraints:
  - source: "kaplan_1989_b1"
    target: "kaplan_1989_b2"
    type: "supports"
    causal_direction: "forward"
    expected_strength: [0.6, 0.8]
    annotation_metadata:
      confidence: "high"
      basis: "Logical connection in ART framework - fatigue creates need for restoration"

  - source: "kaplan_1989_b3"
    target: "kaplan_1989_b2"
    type: "supports"
    expected_strength: [0.5, 0.7]
    annotation_metadata:
      confidence: "medium"
      basis: "Soft fascination is mechanism for restoration"

  - source: "kaplan_1989_b4"
    target: "kaplan_1989_b2"
    type: "supports"
    expected_strength: [0.5, 0.7]
    annotation_metadata:
      confidence: "medium"
      basis: "Being away is component of restoration"

# Expected bridges to other theories
expected_bridges:
  - source_theory: "ART"
    target_theory: "SRT"
    bridge_type: "analogical"
    expected_confidence: [0.3, 0.5]
    annotation_metadata:
      confidence: "medium"
      basis: "Both address restoration; different mechanisms proposed"

# Things that should NOT be extracted
should_NOT_extract:
  - pattern: "ART is proven"
    reason: "Overstates certainty - this is a theory book, not experimental confirmation"

  - pattern: "Nature always restores"
    reason: "Overgeneralization - ART acknowledges individual differences"

  - pattern: "credence > 0.85"
    reason: "Theory book, not experimental confirmation; high credence inappropriate"

  - pattern: "specific effect size"
    reason: "Book doesn't report effect sizes"

  - pattern: "Kaplan discovered"
    reason: "Attribution of discovery inappropriate for review/synthesis"

# Red flags during annotation
red_flags:
  - "Any specific effect size claim (book doesn't report them)"
  - "Claims about specific populations not discussed in book"
  - "Claims with credence > 0.8 (theoretical claims warrant uncertainty)"
  - "Causal claims without 'forward' direction noted (this is theoretical)"

# Validation notes
validation_notes: |
  Kaplan & Kaplan (1989) is a foundational theory book that:
  1. Introduces Attention Restoration Theory (ART)
  2. Proposes four components: fascination, being away, extent, compatibility
  3. Does NOT provide experimental validation (that came later)
  4. Should produce theoretical-level beliefs with moderate credence

  Key validation checks:
  - All four ART components should be extracted
  - Credences should be in [0.5, 0.7] range (theoretical claims)
  - No specific effect sizes should be extracted
  - Bridge to SRT should be generated (analogical)
