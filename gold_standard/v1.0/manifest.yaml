notes: |
  This is the initial Gold Standard corpus for validating the Article Eater
  Post-Quinean extraction system. Papers were selected to provide coverage
  across:
  - Multiple theories (ART, SRT, Prospect-Refuge, Biophilia)
  - Multiple paper types (theory, empirical, review, multi-theory)
  - Multiple environmental domains (natural, sensory, configurational)
  - At least one null result (for negative test validation)
