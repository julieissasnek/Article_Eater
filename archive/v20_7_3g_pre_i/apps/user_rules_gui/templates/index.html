{% extends "layout.html" %}{% block content %}
<table><thead><tr><th>ID</th><th>Name</th><th>Antecedent</th><th>Consequent</th><th>Weight</th><th>Source</th><th>Actions</th></tr></thead>
<tbody>{% for r in rows %}
<tr><td>{{r.id}}</td><td>{{r.name}}</td><td><pre style="white-space:pre-wrap">{{r.antecedent}}</pre></td>
<td><pre style="white-space:pre-wrap">{{r.consequent}}</pre></td><td>{{"%.2f"|format(r.weight)}}</td><td>{{r.source}}</td>
<td><a href="{{url_for('edit_rule', rid=r.id)}}">Edit</a>
<form method="post" action="{{url_for('delete_rule', rid=r.id)}}" style="display:inline" onsubmit="return confirm('Delete?')">
<button>Delete</button></form></td></tr>{% endfor %}</tbody></table>{% endblock %}
